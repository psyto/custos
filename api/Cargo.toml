[package]
name = "custos-api"
version = "0.1.0"
edition = "2021"
publish = false
description = "Custos HTTP API + served wallet-approval UI."

[dependencies]
custos-engine = { path = "../engine" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
