[package]
name = "custos-engine"
version = "0.1.0"
edition = "2021"
publish = false
description = "Custos execution-firewall core: simulate a tx, run user-protective invariants, return a verdict."

[lib]
name = "custos_engine"
path = "src/lib.rs"

[[bin]]
name = "demo"
path = "src/bin/demo.rs"

[dependencies]
litesvm = "0.13"
solana-pubkey = "3"
solana-account = "3"
solana-instruction = "3"
solana-keypair = "3.1"
solana-signer = "3"
solana-transaction = "3"
base64 = "0.22"
serde_json = "1"

[workspace]
