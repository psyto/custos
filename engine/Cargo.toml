[package]
name = "custos-engine"
version = "0.1.0"
edition = "2021"
publish = false
description = "Custos execution-firewall core: simulate a tx, run user-protective invariants, return a verdict."

[lib]
name = "custos_engine"
path = "src/lib.rs"

[[bin]]
name = "demo"
path = "src/bin/demo.rs"

[[bin]]
name = "mandate_demo"
path = "src/bin/mandate_demo.rs"

[[bin]]
name = "agent_demo"
path = "src/bin/agent_demo.rs"

[[bin]]
name = "scan"
path = "src/bin/scan.rs"

[[bin]]
name = "live_red"
path = "src/bin/live_red.rs"

[[bin]]
name = "profile"
path = "src/bin/profile.rs"

[dependencies]
litesvm = "0.13"
bincode = "1"
ureq = { version = "2", features = ["json"] }
solana-message = "3"
solana-pubkey = "3"
solana-account = "3"
solana-instruction = "3"
solana-keypair = "3.1"
solana-signer = "3"
solana-transaction = "3"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reexec-spec = { path = "../../probatio-svm/crates/reexec-spec" }

[workspace]
